name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mutavoce:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name mv -p 8080:8080 mutavoce:test
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsSI http://localhost:8080/ | grep -qi '^permissions-policy: microphone=(self)'
          curl -fsSI http://localhost:8080/ | grep -qi '^cache-control: no-cache'
          curl -fsSI http://localhost:8080/manifest.webmanifest | grep -qi '^content-type: application/manifest+json'
          asset=$(curl -fsS http://localhost:8080/ | grep -o 'assets/index-[^"]*\.js' | head -1)
          curl -fsSI "http://localhost:8080/$asset" | grep -qi 'immutable'
          worklet=$(curl -fsS "http://localhost:8080/$asset" | grep -o 'processors\.worklet-[A-Za-z0-9_-]*\.js' | head -1)
          curl -fsS -o /dev/null "http://localhost:8080/assets/$worklet"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/missing.js)" = 404
          docker inspect --format '{{.Config.User}}' mutavoce:test | grep -qv '^root$\|^$'
          docker logs mv

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
