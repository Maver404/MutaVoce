# Hashed build assets never change; everything else must be revalidated so a new
# release (and its service worker) is picked up.
map $uri $mv_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

# Plain HTTP: fine on localhost, but browsers only allow the microphone over HTTPS
# on any other address.
server {
    listen 8080;
    listen [::]:8080;
    include /etc/nginx/mutavoce/common.conf;
}

# HTTPS with the certificate prepared by /docker-entrypoint.d/40-mutavoce-tls.sh.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    ssl_certificate /tmp/mutavoce-tls/active-cert.pem;
    ssl_certificate_key /tmp/mutavoce-tls/active-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mutavoce_tls:1m;
    include /etc/nginx/mutavoce/common.conf;
}
